name: Model comparison (shopper photos)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["eval/model_compare.py", ".github/workflows/models.yml"]
jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        cat: [bracelets, necklaces, earrings, rings]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install onnxruntime numpy pillow requests
      - run: python eval/model_compare.py ${{ matrix.cat }}
