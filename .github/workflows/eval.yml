name: Model comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["eval/**", ".github/workflows/eval.yml"]
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2 libgl1
      - run: pip install mediapipe onnxruntime numpy pillow requests
      - run: python eval/one_test.py
